<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Harian Pendampingan</title>
<meta name="theme-color" content="#fdfaf2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* ============================================================
   Laporan Harian — DESIGN SYSTEM v4
   Hijau Duolingo + permukaan cream (putih → cream)
   Teks hijau tua di kartu, teks cream di latar hijau.
   CSS-only: logika JS, id, data-*, dan template string tidak diubah.
   ============================================================ */

:root{
  --bg:#45a302;
  --bg-2:#3d8f02;
  --bg-deep:#2f6e01;
  --card:#fff8e7;
  --card-warm:#fdf0cf;
  --card-lav:#eef6d9;
  --ink:#332f1e;
  --ink-2:#4a4630;
  --mute:#6f6a4f;
  --line:#e6ecd6;
  --line-2:#c3d3a4;
  --pri:#58cc02;
  --pri-dark:#3f9a01;
  --pri-ink:#123b00;
  --soft:#fdf4dd;
  --soft-2:#e9f8d0;
  --navy:#3d8f02;
  --navy-dark:#327601;
  --navy-2:#58cc02;
  --grn:#2f9e77;
  --ok:#2f9e77;
  --danger:#e5484d;
  --warn-bg:#f2fad4;
  --warn-ink:#3a5c00;
  --hilite:#c8f542;
  --hilite-deep:#9ccc26;
  --hilite-ink:#2c4a00;
  --mint:#7fe3c4;
  --lime:#a3f13a;
  --snip:#c7ee9c;
  --on-bg:#fffdf0;
  --on-bg-mute:#f2fde3;
  --sh-card:0 4px 0 rgba(30,66,0,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}

body{
  margin:0;color:var(--on-bg);
  background:
    radial-gradient(680px 420px at 85% -6%, #6fd61a 0%, rgba(111,214,26,0) 60%),
    radial-gradient(620px 520px at 8% 104%, #2f6e01 0%, rgba(47,110,1,0) 62%),
    linear-gradient(180deg,#48a802 0%,#3f9702 42%,#357f01 100%);
  background-attachment:fixed;
  font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body.lg{background:linear-gradient(180deg,#4cb003 0%,#3f9702 46%,#357f01 100%)}

h1,h2,h3,h4,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:700;margin:0;line-height:1.2;letter-spacing:-.01em;color:inherit}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px))}
body.lg .wrap{padding:0}

button,i,svg,span{-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0b6b5f;outline-offset:2px}
::selection{background:#d6f5ae;color:#123b00}

/* ---------- kartu ---------- */
.card{
  background:var(--card);color:var(--ink);
  border:0;border-radius:20px;padding:16px;margin-bottom:14px;
  box-shadow:var(--sh-card);
}
.ph{font-size:clamp(24px,6.4vw,29px);margin:2px 0 14px;letter-spacing:-.015em;color:var(--on-bg)}
.ph small{display:block;font:700 13px/1.45 Nunito;color:var(--on-bg-mute);margin-top:5px;letter-spacing:0}

/* ---------- login ---------- */
.hero{padding:46px 20px 14px;text-align:center;color:var(--on-bg)}
.hero h1{font-size:clamp(30px,9vw,38px);margin-top:8px;color:var(--on-bg);letter-spacing:-.02em;text-shadow:0 2px 0 rgba(30,66,0,.35)}
.hero svg{filter:drop-shadow(0 10px 0 rgba(30,66,0,.25));animation:floaty 6s ease-in-out infinite}
.sheet{
  background:var(--card);color:var(--ink);
  border-radius:26px 26px 0 0;padding:24px 20px 34px;min-height:56vh;
  box-shadow:0 -4px 0 rgba(30,66,0,.3);
}
.lgw{display:flex;flex-direction:column;min-height:100vh}
.lgw .sheet{flex:1}
.sheet h2{font-size:22px}
.sheet p{color:var(--mute);margin:5px 0 8px;font-size:15px;font-weight:600}

/* ---------- form ---------- */
label{display:block;font-size:13px;font-weight:800;color:var(--ink-2);margin:14px 0 6px;letter-spacing:.02em}
input,select,textarea{
  width:100%;font:inherit;font-weight:600;color:var(--ink);background:#fbf1dc;
  border:2px solid var(--line);border-radius:12px;padding:12px 14px;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
input::placeholder,textarea::placeholder{color:#b3a888;font-weight:600}
input:hover,select:hover,textarea:hover{background:#f8ecca}
input:focus,select:focus,textarea:focus{
  border-color:var(--navy-2);background:var(--card);outline:none;
  box-shadow:0 0 0 3px rgba(88,204,2,.22);
}
input[type=date]{min-height:49px}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer}
input[type=file]{padding:9px;font-size:13.5px;color:var(--mute);background:#fbf1dc}
input[type=file]::file-selector-button{
  font:800 13px Nunito;border:2px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 14px;border-radius:10px;margin-right:12px;cursor:pointer;
}
textarea{min-height:80px;resize:vertical;line-height:1.5}
select{appearance:none;-webkit-appearance:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.code{
  font:700 22px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:7px;text-align:center;text-transform:uppercase;
  background:var(--card);border-color:var(--line-2);color:var(--navy);
}
.primary{
  width:100%;margin-top:18px;border:0;color:var(--pri-ink);
  background:var(--pri);font:700 16px/1 Fredoka,sans-serif;
  padding:16px 14px;border-radius:16px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.8px;
  box-shadow:0 4px 0 var(--pri-dark);
  transition:transform .1s,box-shadow .1s,filter .15s;
}
.primary:active{transform:translateY(4px);box-shadow:0 0 0 var(--pri-dark)}
.primary[disabled]{opacity:.62;cursor:default;background:#a7e56f;box-shadow:0 4px 0 #8cc45c}
.err{color:var(--danger);font-size:13.5px;font-weight:800;min-height:20px;margin-top:10px}
.demo{margin-top:18px;border-top:2px dashed var(--line);padding-top:14px;font-size:12.5px;color:var(--mute);text-align:center;font-weight:600}

/* ---------- tombol kecil / chip ---------- */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pills button,.sm{
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  font:800 13px Nunito;padding:8px 14px;border-radius:12px;cursor:pointer;
  box-shadow:0 2px 0 var(--line-2);
  transition:transform .1s,box-shadow .1s,background .15s,border-color .15s,color .15s;
}
.pills button:active,.sm:active{transform:translateY(2px);box-shadow:0 0 0 var(--line-2)}
.sm.d{color:var(--danger);border-color:#f6c9cb;box-shadow:0 2px 0 #f6c9cb}
.sm.d:active{box-shadow:0 0 0 #f6c9cb}
button:disabled{opacity:.55;cursor:default;box-shadow:none}

/* ---------- navigasi ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;transform:none;width:auto;
  display:flex;gap:6px;background:var(--card);border-top:0;
  border-radius:0;padding:7px 7px calc(7px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -4px 0 rgba(30,66,0,.24);z-index:5;
}
.nav[hidden]{display:none}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:0;background:none;color:#9aa17a;font:800 10.5px/1.2 Nunito;
  padding:8px 2px;border-radius:14px;cursor:pointer;
  transition:color .15s,background .15s;
}
.nav button span{display:block;white-space:nowrap}
.nav [aria-current=page]{background:var(--pri);color:var(--pri-ink)}
.nav .ni{display:block;width:26px;height:26px;flex:none;background-color:currentColor;-webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
.ni-home{--ic:var(--n-home)}
.ni-plus{--ic:var(--n-plus)}
.ni-chart{--ic:var(--n-chart)}
.ni-user{--ic:var(--n-user)}
.ni-users{--ic:var(--n-users)}
.ni-kid{--ic:var(--n-kid)}


/* ---------- identitas ---------- */
.hi{display:flex;align-items:center;gap:13px;margin:2px 0 16px;color:var(--on-bg)}
.av{
  width:48px;height:48px;border-radius:50%;flex:none;
  background:var(--card);color:var(--navy);border:2px solid rgba(255,253,240,.8);
  display:grid;place-items:center;font:700 21px Fredoka;
  box-shadow:0 4px 0 rgba(30,66,0,.38);
}
.av.big{width:86px;height:86px;font-size:34px;margin:0 auto 10px;border-width:3px;border-color:var(--pri)}
.hi h2{font-size:21px;letter-spacing:-.015em;color:var(--on-bg)}
.hi small{color:var(--on-bg-mute);display:block;font-size:13px;font-weight:700;margin-top:1px}

/* ---------- ring progres ---------- */
.pg{display:flex;align-items:center;gap:16px}
.ring{
  --p:0;width:72px;height:72px;border-radius:50%;flex:none;
  background:conic-gradient(from -90deg,#7ed321 calc(var(--p)*1%),#eef6d9 0);
  display:grid;place-items:center;
}
.ring b{
  background:var(--card);width:56px;height:56px;border-radius:50%;
  display:grid;place-items:center;font:700 15px Fredoka;color:var(--navy);
  border:2px solid var(--line);
}
.pg h3{font-size:17px}
.st{font:700 19px Fredoka;margin:20px 0 10px;display:flex;align-items:center;gap:9px;color:var(--on-bg)}
.st::before{content:'';width:12px;height:12px;border-radius:4px;background:var(--lime);flex:none;box-shadow:0 2px 0 rgba(30,66,0,.35)}

/* ---------- kartu anak ---------- */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kc{
  position:relative;overflow:hidden;isolation:isolate;
  border:2px solid rgba(255,253,240,.55);border-radius:20px;padding:13px 14px 15px;
  text-align:left;cursor:pointer;font:inherit;min-height:158px;display:flex;flex-direction:column;gap:2px;
  box-shadow:0 4px 0 rgba(30,66,0,.42);
  transition:transform .12s ease,box-shadow .12s ease;
  filter:saturate(1.08);
}
.kc>*{position:relative;z-index:2}
.kc::after{
  content:'';position:absolute;width:120px;height:120px;right:-44px;bottom:-56px;
  border-radius:50%;background:rgba(255,253,240,.4);pointer-events:none;
  transition:transform .4s ease,opacity .4s ease;
}
.kc:active{transform:translateY(4px);box-shadow:0 0 0 rgba(30,66,0,.42)}
.kc h3{font-size:18px;margin-top:6px;font-weight:700}
.kc small{opacity:.92;font-size:12.5px;font-weight:700}
.bar{height:10px;border-radius:99px;background:rgba(255,253,240,.65);overflow:hidden;margin-top:auto;border:1px solid rgba(0,0,0,.06)}
.bar i{display:block;height:100%;border-radius:99px;background:currentColor;position:relative;transition:width .45s ease}
.bar i::after{content:'';position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:99px;background:rgba(255,255,255,.5)}

/* ---------- header anak ---------- */
.kh{
  position:relative;overflow:hidden;
  margin:-16px -16px 16px;padding:16px 18px 24px;border-radius:0 0 24px 24px;
  box-shadow:0 4px 0 rgba(30,66,0,.3);
  filter:saturate(1.08);
}
.kh>*{position:relative;z-index:2}
.kh .back{
  border:2px solid rgba(255,253,240,.8);background:rgba(255,253,240,.55);
  color:inherit;font:800 13px Nunito;padding:7px 14px;border-radius:12px;cursor:pointer;
}
.kh h2{font-size:clamp(24px,7vw,28px);margin-top:10px}
.kh p{margin:3px 0 0;opacity:.92;font-size:14px;font-weight:800}

/* ---------- statistik ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stats div{
  background:var(--card);color:var(--ink);border-radius:16px;
  padding:12px 6px;text-align:center;box-shadow:0 4px 0 rgba(30,66,0,.34);
}
.stats b{display:block;font:700 22px Fredoka;color:var(--navy)}
.stats small{color:var(--mute);font-size:11px;font-weight:800;letter-spacing:.02em}
.streak{
  background:var(--hilite);color:var(--hilite-ink);border-radius:18px;
  padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:14px;
  box-shadow:0 4px 0 var(--hilite-deep);
}
.streak b{font:700 26px Fredoka;display:block;color:var(--hilite-ink)}
.streak span{font-size:34px}

/* ---------- bar progres ---------- */
.pb{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:14px 0;font-size:13px;font-weight:800;color:var(--ink)}
.pb div{height:14px;background:#eef0dd;border-radius:99px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;position:relative;transition:width .5s ease}
.pb i::after{content:'';position:absolute;left:7px;right:7px;top:3px;height:4px;border-radius:99px;background:rgba(255,255,255,.45)}
.pb span:last-child{text-align:right;color:var(--mute);font-weight:800}

/* ---------- baris chip horizontal ---------- */
.kids{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px;scrollbar-width:none}
.kids::-webkit-scrollbar{height:0}
.kids button{
  flex:none;border:2px solid transparent;background:var(--card);color:var(--ink);
  font:800 13px Nunito;padding:9px 15px;border-radius:12px;cursor:pointer;
  box-shadow:0 3px 0 rgba(30,66,0,.34);
  transition:transform .1s,box-shadow .1s,border-color .15s,color .15s,background .15s;
}
.kids button:active{transform:translateY(3px);box-shadow:0 0 0 rgba(30,66,0,.34)}
.kids button[aria-pressed=true]{background:var(--pri);color:var(--pri-ink);box-shadow:0 3px 0 var(--pri-dark)}

/* ---------- menu profil ---------- */
.menu{
  display:block;width:100%;text-align:left;border:0;border-top:2px solid var(--line);
  background:none;color:var(--ink);font:800 15.5px Nunito;padding:15px 10px;border-radius:12px;
  cursor:pointer;transition:background .15s;
}
.menu:first-child{border-top:0}
.menu:active{background:var(--soft)}

/* ---------- fieldset & chip pilihan ---------- */
fieldset{border:0;border-top:2px dashed var(--line);margin:20px 0 0;padding:14px 0 0}
legend{font:700 17px Fredoka;padding-right:10px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;font-weight:800}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{
  display:inline-block;padding:8px 15px;border:2px solid var(--line);border-radius:12px;
  cursor:pointer;font-size:13px;font-weight:800;background:var(--card);color:var(--ink-2);
  transition:background .12s,border-color .12s,color .12s,transform .1s;
}
.chips input:checked+span{border-color:var(--pri);background-color:var(--soft-2);color:#2f6b0a}
.chips input:focus-visible+span{outline:3px solid #0b6b5f;outline-offset:2px}
.checks label{display:flex;gap:9px;align-items:center;font-weight:700;margin:8px 0;font-size:14.5px;color:var(--ink)}
.checks input{width:auto;accent-color:var(--pri)}

/* ---------- kartu laporan ---------- */
.rep-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.rep-head h3{font-size:18px}
.rep-head time{color:var(--mute);font-size:12px;text-align:right;font-weight:800}
.sec{margin-top:14px}
.sec h4{
  margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--navy);font-weight:800;font-family:Nunito,sans-serif;
}
.sec p{margin:0;font-size:15px;color:var(--ink-2);font-weight:600}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px}
.tag{
  display:inline-flex;align-items:center;background:var(--soft);padding:5px 11px;line-height:1.25;
  border-radius:99px;font-size:12px;font-weight:800;color:var(--ink-2);border:2px solid var(--line);
}

/* ---------- foto ---------- */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-top:8px}
.pic{border-radius:16px;overflow:hidden;background:var(--card);color:var(--ink);font-size:12px;font-weight:600;border:2px solid var(--line);box-shadow:0 2px 0 var(--line-2)}
.pic .ph2{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mute);font-size:28px}
.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pic div:last-child{padding:8px 10px}
.empty{text-align:center;color:var(--on-bg-mute);padding:34px 12px}
.empty p{margin:10px 0 0;font-weight:800;font-size:15px;color:var(--on-bg)}

/* ---------- kartu pengguna ---------- */
.ucard{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ucard h3{font-size:17px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ucard p{margin:4px 0 0;font-size:13px;color:var(--mute);line-height:1.5;font-weight:600}
.cc{font:700 13px ui-monospace,Menlo,monospace;background:var(--soft);color:var(--navy);padding:4px 9px;border-radius:8px;letter-spacing:1px;border:2px solid var(--line)}

/* ---------- toast / modal ---------- */
.toast{
  position:fixed;inset:0;display:grid;place-items:center;z-index:20;padding:20px;
  background:rgba(18,45,0,.62);
}
.toast[hidden]{display:none}
.pop{
  background:var(--card);color:var(--ink);border:0;border-radius:22px;
  padding:22px 22px 24px;text-align:center;width:100%;max-width:320px;
  box-shadow:0 6px 0 rgba(30,66,0,.38);animation:pop .22s cubic-bezier(.34,1.4,.64,1);
  max-height:88vh;overflow:auto;
}
.pop.bad{box-shadow:0 6px 0 #e58b93}
.pop b{display:block;font:700 20px Fredoka,sans-serif;margin:8px 0 4px}
.pop p{margin:0;color:var(--mute);font-size:14px;line-height:1.5;font-weight:600}
.pk{text-align:left;max-height:82vh;overflow:auto}
.pk b{text-align:center;margin-bottom:8px}
.pk::-webkit-scrollbar,.pop::-webkit-scrollbar{width:8px}
.pk::-webkit-scrollbar-thumb,.pop::-webkit-scrollbar-thumb{background:#c3d3a4;border-radius:99px}
.opt{
  display:block;width:100%;text-align:left;margin-top:8px;padding:14px 16px;
  border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
  font:800 15px Nunito,sans-serif;cursor:pointer;box-shadow:0 2px 0 var(--line-2);
  transition:transform .1s,box-shadow .1s,border-color .15s,background .15s,color .15s;
}
.opt:active{transform:translateY(2px);box-shadow:0 0 0 var(--line-2)}
.opt[aria-checked=true]{border-color:var(--pri);background-color:var(--soft-2);color:#2f6b0a;box-shadow:0 2px 0 var(--snip)}

/* ---------- select pengganti ---------- */
select.hid{display:none}
.sel{
  position:relative;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);
  background:var(--card);border:2px solid var(--line);border-radius:12px;
  padding:12px 42px 12px 14px;cursor:pointer;box-shadow:0 2px 0 var(--line-2);
  transition:border-color .15s,background .15s;
}
.sel::after{content:'\25BE';position:absolute;right:15px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:13px}

/* ---------- suasana hati ---------- */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.moods label{margin:0}
.moods input{position:absolute;opacity:0;width:1px;height:1px}
.moods span{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;
  border:2px solid var(--line);border-radius:14px;background:var(--card);
  font-size:12px;font-weight:800;cursor:pointer;color:var(--ink-2);
  transition:background .12s,border-color .12s,transform .12s;
}
.moods input:checked+span{border-color:var(--pri);background-color:var(--soft-2);color:#2f6b0a}
.moods input:focus-visible+span{outline:3px solid #0b6b5f;outline-offset:2px}

/* ---------- minggu / kalender ---------- */
.wkd{margin-bottom:8px}
.wk{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;cursor:pointer;color:var(--on-bg)}
.wk::-webkit-details-marker{display:none}
.wk::after{content:'\25BE';color:var(--on-bg-mute);margin-left:2px;transition:transform .2s}
.wkd[open]>.wk::after{transform:rotate(180deg)}
.wk b{display:block;font:700 17.5px Fredoka,sans-serif;color:var(--on-bg)}
.wk small{color:var(--on-bg-mute);font-size:12px;font-weight:700}
.wk .tag{background:rgba(255,253,240,.18);border-color:rgba(255,253,240,.42);color:var(--on-bg)}
.gn{display:block;margin-top:8px;color:var(--mute);font-size:12px;line-height:1.5;font-weight:600}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px;text-align:center}
.dy{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dy small{color:var(--mute);font-size:11px;font-weight:800}
.dy svg{width:100%;max-width:40px;height:auto}
.nod{display:block;width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line-2);background:#fdf6e6}

/* ---------- badge bintang / PR ---------- */
.bt{
  display:inline-flex;align-items:center;gap:6px;
  background:#f4ffd6;color:#3a5c00;border:2px solid var(--hilite);
  padding:5px 12px;border-radius:99px;font-weight:800;font-size:12px;margin-bottom:6px;
}
.mp{border-left:6px solid var(--line);padding:4px 0 4px 13px;margin:12px 0}
#cards .mp{
  background:var(--card);border:2px solid var(--line);border-left-width:8px;border-radius:16px;
  padding:12px 14px 14px;margin:0 0 12px;box-shadow:0 2px 0 var(--line-2);
}
.mph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.prb{
  background:var(--warn-bg);color:var(--warn-ink);border:2px solid #c9e86b;
  border-radius:12px;padding:9px 12px;margin:8px 0 0;font-size:13.5px;line-height:1.5;font-weight:700;
}
.prok{
  display:inline-flex;align-items:center;gap:6px;background:#d8f7e6;color:#146c4c;
  border-radius:99px;padding:3px 11px;font-weight:800;font-size:12px;margin-top:6px;
}
.prc{margin-top:6px;padding:8px 12px;border-left:4px solid var(--navy-2);background:var(--card);color:var(--ink);border-radius:8px}
.prx{
  display:inline-flex;align-items:center;gap:7px;background:var(--soft-2);color:#2f6b0a;
  border:2px solid var(--snip);padding:5px 12px;border-radius:99px;font-weight:800;font-size:12px;margin-top:6px;
}
.prx span{font-size:17px;line-height:1}
.prx .rxi{display:inline-block;width:24px;height:24px;vertical-align:middle;margin-right:2px;background-size:contain;background-repeat:no-repeat;background-position:center}
.rxg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:8px 0 4px}
.rx{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;
  border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink-2);
  font:800 11px/1.3 Nunito,sans-serif;cursor:pointer;text-align:center;
  box-shadow:0 2px 0 var(--line-2);
  transition:transform .1s,box-shadow .1s,border-color .15s,background .15s,color .15s;
}
.rx:active{transform:translateY(2px);box-shadow:0 0 0 var(--line-2)}
.rx span{font-size:26px;line-height:1.15}
.rx[aria-pressed=true]{border-color:var(--pri);background-color:var(--soft-2);color:#2f6b0a;box-shadow:0 2px 0 var(--snip)}

/* ---------- animasi ---------- */
@keyframes pop{from{transform:scale(.92) translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- interaksi (non-touch) ---------- */
@media(hover:hover){
  .card:hover{box-shadow:0 6px 0 rgba(30,66,0,.5)}
  .kc:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(30,66,0,.48)}
  .kc:hover::after{transform:scale(1.3);opacity:.8}
  .primary:hover{filter:brightness(1.05)}
  .opt:hover,.sm:hover,.pills button:hover,.rx:hover{border-color:var(--line-2);background-color:#fdf6e0}
  .chips span:hover{border-color:var(--line-2);background-color:#fdf6e0}
  .kids button:hover{filter:brightness(1.02)}
  .nav button:hover:not([aria-current=page]){background:var(--soft)}
  .menu:hover{background:var(--soft)}
}

/* ---------- laptop / desktop ---------- */
@media(min-width:900px){
  body{font-size:16.5px}
  .wrap{max-width:none;margin:0;padding:34px 40px 60px 292px}
  body.lg .wrap{padding:0}
  #main{max-width:1040px;margin:0 auto}
  body.lg #main{max-width:none}

  .lgw{flex-direction:row}
  .lgw .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
  .lgw .hero svg{width:min(400px,72%);height:auto}
  .lgw .hero h1{font-size:48px;margin-top:18px}
  .lgw .sheet{
    flex:0 0 480px;border-radius:32px 0 0 32px;display:flex;flex-direction:column;
    justify-content:center;padding:48px 52px;min-height:100vh;
    box-shadow:-6px 0 0 rgba(30,66,0,.3);
  }

  .nav{
    left:0;right:auto;top:0;bottom:0;transform:none;width:252px;flex-direction:column;
    justify-content:flex-start;border-radius:0;padding:24px 16px;gap:6px;box-shadow:none;
  }
  .nav::before{
    content:'Laporan Harian';font:700 22px Fredoka,sans-serif;padding:6px 16px 22px;
    color:var(--on-bg);letter-spacing:-.02em;
  }
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;padding:14px 16px;font-size:14.5px;border-radius:14px;gap:12px;color:#7f8a63}
  .nav button span{display:inline}
  .nav [aria-current=page]{background:var(--pri);color:var(--pri-ink)}
  .nav .ni{width:28px;height:28px}

  .ph{font-size:32px}
  .hi h2{font-size:27px}
  .av{width:56px;height:56px}
  .pg{max-width:470px}
  .kg{grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
  .kc{min-height:172px}
  .kh{margin:0 0 20px;border-radius:24px;padding:22px 26px 24px}
  .stats{max-width:540px}
  .wkc{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px;align-items:start}
  #f{max-width:1000px}
  .fcols{display:grid;grid-template-columns:1fr 1fr;gap:0 38px}
  .ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0 18px;align-items:start}
  #uf,#kf{max-width:600px}
  .streak,.kids{max-width:720px}
  .toast .pop{max-width:370px}
  .wk{max-width:1000px}
}

/* ============================================================
   MOTION v2 — gulir & perpindahan (murni CSS, tanpa JS)
   ============================================================ */
html{scroll-behavior:smooth}

@supports (animation-timeline:scroll()){
  body::after{
    content:'';position:fixed;top:0;left:0;right:0;height:4px;z-index:60;pointer-events:none;
    transform:scaleX(0);transform-origin:0 50%;
    background:linear-gradient(90deg,#a3f13a,#7fe3c4 55%,#fffdf0);
    animation:scrollbarGrow linear both;
    animation-timeline:scroll(root block);
  }
  @keyframes scrollbarGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}

@keyframes rise{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
#main>*{animation:rise .34s cubic-bezier(.34,1.4,.64,1) both}

@keyframes revealIn{from{transform:translateY(22px) scale(.98)}to{transform:none}}
@supports (animation-timeline:view()){
  #main>*,.wkc>*,.ulist>*,.pics>*{
    animation:rise .34s cubic-bezier(.34,1.4,.64,1) both,revealIn .85s cubic-bezier(.34,1.2,.64,1) backwards;
    animation-timeline:auto,view();
    animation-range:normal,entry 4% entry 60%;
  }
}

@keyframes pillIn{from{transform:scale(.9)}to{transform:none}}
@keyframes iconPop{0%{transform:scale(.7) rotate(-9deg)}60%{transform:scale(1.1) rotate(3deg)}100%{transform:none}}
.nav [aria-current=page]{animation:pillIn .3s cubic-bezier(.34,1.5,.64,1) both}
.nav [aria-current=page] .ni{animation:iconPop .42s cubic-bezier(.34,1.6,.64,1) both}

@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.lgw .sheet{animation:sheetUp .55s cubic-bezier(.34,1.2,.64,1) both}
.lgw .hero>*{animation:rise .5s cubic-bezier(.34,1.4,.64,1) both}
.lgw .hero>*:nth-child(2){animation-delay:.08s}
.lgw .hero>*:nth-child(3){animation-delay:.16s}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  body::after{display:none}
  #main>*,.wkc>*,.ulist>*,.pics>*,.nav [aria-current=page],.nav [aria-current=page] .ni,.lgw .sheet,.lgw .hero>*{animation:none}
  *{transition-duration:.01ms!important}
}

/* ============================================================
   MASKOT LOGIN — mata bergerak (kedip + lihat sekeliling)
   Circle 1-2 = bola mata · 3-4 = pupil · 5-6 = kilau
   ============================================================ */
@keyframes eyeBlink{
  0%,89%,100%{transform:scaleY(1)}
  91%{transform:scaleY(.06)}
  93%{transform:scaleY(1)}
  94.5%{transform:scaleY(.08)}
  96%,100%{transform:scaleY(1)}
}
@keyframes pupilLife{
  0%,6%{transform:translate(0,0) scaleY(1)}
  10%,18%{transform:translate(-5px,1px) scaleY(1)}
  24%,31%{transform:translate(5px,1px) scaleY(1)}
  36%,43%{transform:translate(0,-4px) scaleY(1)}
  48%,60%{transform:translate(0,0) scaleY(1)}
  65%,71%{transform:translate(-4px,-2px) scaleY(1)}
  76%,88%{transform:translate(0,0) scaleY(1)}
  91%{transform:translate(0,0) scaleY(.06)}
  93%{transform:translate(0,0) scaleY(1)}
  94.5%{transform:translate(0,0) scaleY(.08)}
  96%,100%{transform:translate(0,0) scaleY(1)}
}
.lgw .hero svg circle:nth-of-type(1),
.lgw .hero svg circle:nth-of-type(2){
  transform-box:fill-box;transform-origin:center;
  animation:eyeBlink 6.5s cubic-bezier(.45,0,.35,1) infinite;
}
.lgw .hero svg circle:nth-of-type(3),
.lgw .hero svg circle:nth-of-type(4),
.lgw .hero svg circle:nth-of-type(5),
.lgw .hero svg circle:nth-of-type(6){
  transform-box:fill-box;transform-origin:center;
  animation:pupilLife 6.5s cubic-bezier(.45,0,.35,1) infinite;
}

@media(prefers-reduced-motion:reduce){
  .lgw .hero svg circle:nth-of-type(1),
  .lgw .hero svg circle:nth-of-type(2),
  .lgw .hero svg circle:nth-of-type(3),
  .lgw .hero svg circle:nth-of-type(4),
  .lgw .hero svg circle:nth-of-type(5),
  .lgw .hero svg circle:nth-of-type(6){animation:none}
}

/* ---------- scrollbar halus ---------- */
@media(pointer:fine){
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#8fd63a;border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#a6e85a;background-clip:content-box}
}

 $('#oldPics').innerHTML=lama+(boleh?'':'<small class="gn">Foto tidak bisa ditambahkan karena laporan ini sudah lewat 3 hari.</small>');
 if(!boleh)$('#foto').disabled=true;
 const ds=$('#ds');if(ds)ds.textContent='Mengubah laporan '+fmt(r.tgl)+'. Anak dan tanggal tidak bisa diubah.'}
function openSalin(){const id=+$('#anak').value,p=$('#picker');p.removeAttribute('data-lock');
 const rs=reports.filter(r=>r.anak===id).sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,6);
 p.innerHTML=`<div class="pop pk" role="dialog" aria-label="Salin dari laporan"><b>Salin dari laporan</b><p style="margin:2px 0 6px">Isi formulir dari laporan yang pernah dibuat. Tanggal, foto, dan bintang tidak ikut disalin.</p>${rs.length?rs.map(r=>`<button type="button" class="opt" data-act="salinpilih" data-id="${r.id}">${esc(sh(r.tgl))} · ${esc(r.mapel.map(m=>m.mapel).join(', ')||'Laporan')}</button>`).join(''):'<p>Belum ada laporan untuk anak ini.</p>'}<button type="button" class="sm" style="width:100%;margin-top:10px" data-act="closepick">Tutup</button></div>`;p.hidden=false}
function salinDari(id){const r=reports.find(x=>x.id===id);if(!r)return;
 const set=(k,v)=>{const e=$('#'+k);if(e)e.value=v},kosong=t=>t==='-'?'':t;
 set('sosial',kosong(r.sosial));set('mandiri',kosong(r.mandiri));set('catO',kosong(r.catO));
 [['mood',r.mood],['fokus',String(r.fokus)]].forEach(([n,v])=>{const x=document.querySelector(`input[name=${n}][value="${v}"]`);if(x)x.checked=true});
 cards=r.mapel.map(m=>({mapel:m.mapel,topik:m.topik,durasi:m.durasi,capaian:m.capaian,cat:m.cat==='-'?'':m.cat,pr:'',tenggat:''}));drawCards();
 $('#picker').hidden=true;saveDraft();toast('Isi laporan '+sh(r.tgl)+' sudah disalin. Periksa dan ubah seperlunya.',false,'Tersalin!')}
function toggleBoxes(){const r=$('#ur').value;$('#kidsBox').hidden=!(r==='pendamping'||r==='ortu');$('#clsBox').hidden=r!=='wali'}

function render(){
 document.body.classList.toggle('lg',!me);
 const m=$('#main'),nav=$('#nav');
 if(!me){nav.hidden=true;m.innerHTML=loginView();$('#lf').onsubmit=login;$('#kode').oninput=fmtCode;return}
 nav.hidden=false;
 if(page!=='kid'&&!NAV[me.role].some(n=>n[0]===page))page=NAV[me.role][0][0];
 nav.innerHTML=NAV[me.role].map(n=>`<button data-page="${n[0]}" aria-current="${n[0]===page||(page==='kid'&&n[0]==='home')?'page':'false'}"><i class="ni ni-${n[2]}" aria-hidden="true"></i><span>${n[1]}</span></button>`).join('');
 m.innerHTML=({home:homeView,kid:kidView,form:formPage,prog:progView,prof:profView,user:userPage,anak:anakPage})[page]();
 if(page==='form'&&$('#foto')){$('#foto').onchange=onFoto;$('#simpan').onclick=simpan;editLap?fillForm():restoreDraft();drawCards();drawPrev();$('#f').addEventListener('input',cardInput);$('#f').addEventListener('change',cardInput);$('#f').addEventListener('input',saveDraft);$('#f').addEventListener('change',saveDraft)}
 if(page==='user'){$('#roleChips').onchange=ev=>{$('#ur').value=ev.target.value;toggleBoxes()};toggleBoxes()}
 enhance()
}
function enhance(){document.querySelectorAll('#main select').forEach(x=>{if(x.dataset.e)return;x.dataset.e=1;x.classList.add('hid');const b=document.createElement('button');b.type='button';b.disabled=x.disabled;b.className='sel';b.dataset.sel=x.id;b.setAttribute('aria-haspopup','dialog');b.textContent=x.options[x.selectedIndex].text;x.after(b)})}
function openPick(id){$('#picker').removeAttribute('data-lock');const x=document.getElementById(id),l=document.querySelector(`label[for=${id}]`),t=l?l.textContent:'Pilih',p=$('#picker');
 p.innerHTML=`<div class="pop pk" role="dialog" aria-label="${esc(t)}"><b>${esc(t)}</b>${[...x.options].map((o,i)=>`<button type="button" class="opt" data-opt="${i}" data-for="${id}" aria-checked="${i===x.selectedIndex}">${esc(o.text)}</button>`).join('')}</div>`;p.hidden=false}
function pickOpt(d){const x=document.getElementById(d.for);x.selectedIndex=+d.opt;x.dispatchEvent(new Event('change',{bubbles:true}));document.querySelector(`[data-sel=${d.for}]`).textContent=x.options[x.selectedIndex].text;$('#picker').hidden=true}
function anakPage(){
 const k=KIDS.find(x=>x.id===editKid)||{nama:'',kelas:''},no='<b style="color:#b3402f">belum ada</b>';
 const list=KIDS.map(x=>{const pd=USERS.filter(u=>u.role==='pendamping'&&u.childIds.includes(x.id)).map(u=>u.nama),ot=USERS.filter(u=>u.role==='ortu'&&u.childIds.includes(x.id)).map(u=>u.nama);
  return `<div class="card ucard"><div style="display:flex;gap:10px;align-items:center">${face('Tenang',46)}<div><h3>${esc(x.nama)} <span class="tag">Kelas ${esc(x.kelas)}</span></h3><p>Pendamping: ${pd.length?esc(pd.join(', ')):no}<br>Orang tua: ${ot.length?esc(ot.join(', ')):no}<br>${kr(x.id).length} laporan</p></div></div><div><button class="sm" data-act="editk" data-id="${x.id}">Ubah</button> <button class="sm d" data-act="delk" data-id="${x.id}">Hapus</button></div></div>`}).join('');
 return `<h2 class="ph">Anak<small>Tambah profil anak, lalu tautkan di menu Pengguna</small></h2><div class="ulist">${list}</div><form class="card" id="kf" onsubmit="return false"><h3>${editKid?'Ubah profil anak':'Tambah anak baru'}</h3>
 <label for="kn">Nama anak</label><input id="kn" value="${esc(k.nama)}" placeholder="Nama lengkap"><label for="kk">Kelas</label><input id="kk" value="${esc(k.kelas)}" placeholder="Contoh: 3A" maxlength="8" autocapitalize="characters">
 <button class="primary" data-act="savek">${editKid?'Simpan perubahan':'Tambah anak'}</button>${editKid?'<button class="sm" style="margin-top:8px;width:100%" data-act="cancelk">Batal ubah</button>':''}</form>`}


const addDay=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const mon=d=>addDay(d,-((new Date(d+'T00:00:00Z').getUTCDay()+6)%7));
const sh=d=>new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
function repList(list){
 if(!list.length)return empty('Belum ada laporan untuk anak ini.');
 const g={},cur=mon(today);list.forEach(r=>(g[mon(r.tgl)]=g[mon(r.tgl)]||[]).push(r));
 return Object.keys(g).sort().reverse().map(w=>{
  const rs=g[w].sort((a,b)=>b.tgl.localeCompare(a.tgl)),rng=sh(w)+' – '+sh(addDay(w,6)),isNow=w===cur,isLast=w===addDay(cur,-7);
  const name=isNow?'Minggu ini':isLast?'Minggu lalu':rng,sub=isNow||isLast?`<small>${rng}</small>`:'';
  const f=(Math.round(rs.reduce((a,r)=>a+r.fokus,0)/rs.length*10)/10).toString().replace('.',',');
  return `<details class="wkd" ${isNow||isLast?'open':''}><summary class="wk"><div><b>${name}</b>${sub}</div><span class="tag">${rs.length} laporan · fokus ${f}</span></summary><div class="wkc">${rs.map(repCard).join('')}</div></details>`}).join('')}
let dT;
const draftKey=()=>'draft:'+me.id;
const jam=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const DF=['anak','tgl','sosial','mandiri','catO'];
function showDraft(msg){const e=$('#ds');if(e)e.innerHTML=msg+(msg.includes('·')?' <button type="button" class="sm" style="padding:2px 9px;font-size:12px" data-act="cleardraft">Hapus draf</button>':'')}
function saveDraft(){clearTimeout(dT);dT=setTimeout(()=>{
 if(!me||page!=='form'||!$('#f')||editLap)return;
 const v={};DF.forEach(id=>v[id]=$('#'+id).value);
 const pk=n=>{const x=document.querySelector(`input[name=${n}]:checked`);return x?x.value:''};
 const d={t:Date.now(),v,mood:pk('mood'),fokus:pk('fokus'),bintang:pk('bintang'),cards,foto:pending};
 if(!cards.length&&!v.sosial.trim()&&!v.mandiri.trim()&&!v.catO.trim()&&!pending.length){try{localStorage.removeItem(draftKey())}catch(_){}showDraft('Draf tersimpan otomatis di HP ini.');return}
 let msg='Draf tersimpan otomatis · '+jam(d.t);
 try{try{localStorage.setItem(draftKey(),JSON.stringify(d))}catch(_){d.foto=[];localStorage.setItem(draftKey(),JSON.stringify(d));msg='Draf tersimpan tanpa foto (penyimpanan HP penuh) · '+jam(d.t)}}catch(_){msg='Draf tidak bisa disimpan di perangkat ini'}
 showDraft(msg)},600)}
function restoreDraft(){let d=null;try{d=JSON.parse(localStorage.getItem(draftKey())||'null')}catch(_){}
 if(!d)return;
 DF.forEach(id=>{const el=$('#'+id);if(!el||d.v[id]===undefined)return;if(el.tagName==='SELECT'&&![...el.options].some(o=>o.value===d.v[id]))return;el.value=d.v[id]});
 ['mood','fokus','bintang'].forEach(n=>{const r=document.querySelector(`input[name=${n}][value="${d[n]}"]`);if(r)r.checked=true});
 if(!pending.length&&d.foto&&d.foto.length)pending=d.foto;
 if(!cards.length&&d.cards&&d.cards.length)cards=d.cards;
 if($('#anak').value)selKid=+$('#anak').value;
 showDraft('Draf dipulihkan · disimpan '+jam(d.t))}

const kb=n=>n>=1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';
const MAXB=600*1024;
async function compress(f){
 const o=await new Promise((ok,no)=>{const rd=new FileReader();rd.onload=()=>ok(rd.result);rd.onerror=no;rd.readAsDataURL(f)});
 const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=o});
 const w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 let src,after;for(const q of [.72,.55,.4]){src=c.toDataURL('image/jpeg',q);after=Math.round((src.length-23)*3/4);if(after<=MAXB)break}
 if(!src||after>MAXB)throw new Error('besar');
 if(f.type==='image/jpeg'&&after>=f.size&&f.size<=MAXB)return{src:o,before:f.size,after:f.size};
 return{src,before:f.size,after}}
async function onFoto(e){const fs=[...e.target.files];e.target.value='';
 for(const f of fs){try{const r=await compress(f);pending.push({...r,cap:f.name.replace(/\.[^.]+$/,'')});drawPrev();saveDraft()}catch(_){toast('Foto "'+f.name+'" tidak bisa dikecilkan, jadi tidak diunggah. Coba pilih foto lain.',true,'Foto ditolak')}}}
function drawPrev(){const p=$('#prev');if(!p)return;p.innerHTML=pending.map((f,i)=>`<figure class="pic" style="margin:0"><img src="${f.src}" alt=""><div><input aria-label="Keterangan foto" value="${esc(f.cap)}" data-i="${i}" style="padding:4px 6px;font-size:12px"><small class="gn" style="margin-top:4px">${f.before===f.after?kb(f.before)+(f.err?' (tidak dikecilkan)':' (sudah kecil)'):kb(f.before)+' → '+kb(f.after)}</small><button type="button" class="sm" style="margin-top:4px;padding:3px 9px" data-act="rmfoto" data-i="${i}">Buang</button></div></figure>`).join('');p.querySelectorAll('input').forEach(i=>i.oninput=()=>pending[i.dataset.i].cap=i.value)}


function toast(t,err,h){const e=$('#toast');e.innerHTML=`<div class="pop${err?' bad':''}">${face(err?'Bingung':'Senang',76)}<b>${h||(err?'Oops!':'Berhasil!')}</b><p>${esc(t)}</p></div>`;e.hidden=false;e.onclick=()=>e.hidden=true;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,err?3200:2200)}
document.addEventListener('click',async e=>{if(e.target.id==='picker'){if(!e.target.dataset.lock)e.target.hidden=true;return}const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.sel){openPick(d.sel);return}if(d.opt!==undefined){pickOpt(d);return}
 if(d.act==='out'){await sb.auth.signOut();me=null;USERS=[];reports=[];KIDS.length=0;page='home';pending=[];editId=null;editLap=null;render();toast('Anda sudah keluar',false,'Sampai jumpa!')}
 else if(d.act==='help')toast('Hubungi admin sekolah untuk bantuan',false,'Bantuan')
 else if(d.page){editLap=null;page=d.page;render();window.scrollTo(0,0)}
 else if(d.kid){selKid=+d.kid;page='kid';render();window.scrollTo(0,0)}
 else if(d.kid2){selKid=+d.kid2;render()}
 else if(d.mo){selMon=d.mo;render()}
 else if(d.act==='newcode')newCode(d.id)
 else if(d.act==='closepick'){const p=$('#picker');p.hidden=true;delete p.dataset.lock}
 else if(d.act==='copycode'){try{navigator.clipboard.writeText(d.kode).then(()=>toast('Kode disalin',false,'Tersalin!'),()=>toast(d.kode))}catch(_){toast(d.kode)}}
 else if(d.act==='saveu')saveUser()
 else if(d.act==='savek')saveKid()
 else if(d.act==='editk'){editKid=+d.id;render();$('#kf').scrollIntoView({behavior:'smooth'})}
 else if(d.act==='cancelk'){editKid=null;render()}
 else if(d.act==='delk')delKid(d.id)
 else if(d.act==='rmfoto'){pending.splice(+d.i,1);drawPrev();saveDraft()}
 else if(d.act==='prselesai')prToggle(+d.id)
 else if(d.act==='rxbuka')openRx(+d.id)
 else if(d.act==='rxpilih')rxSimpan(+d.id,d.k)
 else if(d.act==='addmapel')openMapel()
 else if(d.act==='pilihmapel'){cards.push({mapel:d.m,topik:'',durasi:30,capaian:'Tercapai',cat:'',pr:'',tenggat:''});$('#picker').hidden=true;drawCards();saveDraft()}
 else if(d.act==='rmmapel'){cards.splice(+d.i,1);drawCards();saveDraft()}
 else if(d.act==='salin')openSalin()
 else if(d.act==='salinpilih')salinDari(+d.id)
 else if(d.act==='editlap'){const r=reports.find(x=>x.id===+d.id);if(r){editLap=r.id;selKid=r.anak;pending=[];cards=[];page='form';render();window.scrollTo(0,0)}}
 else if(d.act==='cancellap'){editLap=null;pending=[];cards=[];page='kid';render();window.scrollTo(0,0)}
 else if(d.act==='cleardraft'){try{localStorage.removeItem(draftKey())}catch(_){}pending=[];render();toast('Draf sudah dihapus',false,'Terhapus')}
 else if(d.act==='edit'){editId=d.id;render();$('#uf').scrollIntoView({behavior:'smooth'})}
 else if(d.act==='cancel'){editId=null;render()}
 else if(d.act==='del')delUser(d.id)});
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;render()}});
async function boot(){render();const{data:{session}}=await sb.auth.getSession();if(session&&await loadAll()){page=me.role==='admin'?'user':'home';render()}}
boot();
</script>
